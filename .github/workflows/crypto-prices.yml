name: Daily Crypto Prices

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  send-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tempo CLI
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Setup Tempo Wallet
        env:
          TEMPO_KEYS_TOML: ${{ secrets.TEMPO_KEYS_TOML }}
          TEMPO_CONFIG_TOML: ${{ secrets.TEMPO_CONFIG_TOML }}
        run: |
          mkdir -p "$HOME/.tempo/wallet"
          echo "$TEMPO_KEYS_TOML" > "$HOME/.tempo/wallet/keys.toml"
          echo "$TEMPO_CONFIG_TOML" > "$HOME/.tempo/config.toml"
          export PATH="$HOME/.tempo/bin:$PATH"
          tempo wallet whoami

      - name: Send Crypto Prices to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PATH="$HOME/.tempo/bin:$PATH"
          PRICES=$(tempo request 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=20&page=1' 2>/dev/null) || PRICES=""
          TEXT=$(echo "$PRICES" | python3 -c "
import sys,json
coins=json.load(sys.stdin)
lines=['Gia 20 Coin Top - $(date +\"%d/%m/%Y %H:%M\")']
for c in coins:
    name=c['name']
    sym=c['symbol'].upper()
    price=c['current_price']
    chg=c.get('price_change_percentage_24h') or 0
    arrow='[+]' if chg>=0 else '[-]'
    pstr=str(round(price,2)) if price>=1 else str(round(price,6))
    lines.append(arrow+' '+name+' ('+sym+'): \$'+pstr+' ('+str(round(chg,2))+'%)')
print('%0A'.join(lines))
" 2>/dev/null || echo "Khong lay duoc gia")
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}" > /dev/null
          echo "Done!"
