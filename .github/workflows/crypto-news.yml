name: Daily Crypto News

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tempo CLI
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Setup Tempo Wallet
        env:
          TEMPO_KEYS_TOML: ${{ secrets.TEMPO_KEYS_TOML }}
          TEMPO_CONFIG_TOML: ${{ secrets.TEMPO_CONFIG_TOML }}
        run: |
          mkdir -p "$HOME/.tempo/wallet"
          echo "$TEMPO_KEYS_TOML" > "$HOME/.tempo/wallet/keys.toml"
          echo "$TEMPO_CONFIG_TOML" > "$HOME/.tempo/config.toml"
          export PATH="$HOME/.tempo/bin:$PATH"
          tempo wallet whoami

      - name: Send Crypto News to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PATH="$HOME/.tempo/bin:$PATH"
          NEWS=$(tempo request 'https://cryptopanic.com/api/free/v1/posts/?auth_token=public&filter=hot&kind=news&limit=5' 2>/dev/null) || NEWS=""
          DATE=$(date '+%d/%m/%Y %H:%M')
          TEXT=$(echo "$NEWS" | python3 -c "
import sys,json
d=json.load(sys.stdin)
items=d.get('results',[])[:5]
lines=['5 Tin tuc Crypto nong nhat - $(date +\"%d/%m/%Y %H:%M\")']
for i,item in enumerate(items,1):
    lines.append(str(i)+'. '+item.get('title',''))
    lines.append('   '+item.get('url',''))
print('%0A'.join(lines))
" 2>/dev/null || echo "Khong lay duoc tin tuc")
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}&disable_web_page_preview=true" > /dev/null
          echo "Done!"
