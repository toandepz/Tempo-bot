name: Daily Crypto News

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tempo CLI
        run: |
          curl -fsSL https://tempo.xyz/install | bash
          echo "$HOME/.tempo/bin" >> $GITHUB_PATH

      - name: Setup Tempo Wallet
        env:
          TEMPO_KEYS_TOML: ${{ secrets.TEMPO_KEYS_TOML }}
          TEMPO_CONFIG_TOML: ${{ secrets.TEMPO_CONFIG_TOML }}
        run: |
          mkdir -p "$HOME/.tempo/wallet"
          printf '%s' "$TEMPO_KEYS_TOML" > "$HOME/.tempo/wallet/keys.toml"
          printf '%s' "$TEMPO_CONFIG_TOML" > "$HOME/.tempo/config.toml"
          tempo wallet whoami

      - name: Fetch Crypto News via Tempo Perplexity
        run: |
          QUERY='{"query":"top 5 crypto news today bitcoin ethereum price"}'
          tempo request -j -s -X POST --json "$QUERY" \
            https://perplexity.mpp.paywithlocus.com/perplexity/search \
            > /tmp/news.json 2>/dev/null || echo '{"success":false,"data":{"results":[]}}' > /tmp/news.json
          echo "Fetch done"
          head -c 200 /tmp/news.json

      - name: Send Crypto News to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.parse, datetime

          token = os.environ['TELEGRAM_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          now = datetime.datetime.now().strftime('%d/%m/%Y %H:%M')

          num_icons = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣']

          try:
              with open('/tmp/news.json') as f:
                  result = json.load(f)

              items = []
              if result.get('success') and result.get('data'):
                  items = result['data'].get('results', [])[:5]

              lines = [
                  '\U0001f525 Tin Tức Crypto N\xf3ng - ' + now,
                  '━' * 20,
              ]

              if items:
                  for i, item in enumerate(items):
                      title = item.get('title', '')
                      url = item.get('url', '')
                      date = item.get('last_updated', '')
                      icon = num_icons[i] if i < len(num_icons) else str(i+1) + '.'
                      lines.append(icon + ' ' + title)
                      if date:
                          lines.append('   \U0001f4c5 ' + date)
                      lines.append('   \U0001f517 ' + url)
                      lines.append('')
              else:
                  lines.append('⚠️ Kh\xf4ng lấy được tin tức l\xfa c này')

              lines.append('━' * 20)
              lines.append('\U0001f916 Nguồn: Perplexity AI qua Tempo')
              text = '\n'.join(lines)

          except Exception as e:
              text = '❌ Lỗi lấy tin tức - ' + now + '\n' + str(e)

          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'disable_web_page_preview': 'true'
          }).encode()
          req = urllib.request.Request(
              'https://api.telegram.org/bot' + token + '/sendMessage', data=data
          )
          resp = urllib.request.urlopen(req)
          print('Sent OK:', resp.status)
          PYEOF
