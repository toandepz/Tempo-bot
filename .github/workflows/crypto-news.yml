name: 📰 Daily Crypto News

on:
  schedule:
    - cron: "0 1 * * *"  # 8:00 sáng Hà Nội (UTC+7)
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tempo CLI
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Get Crypto News & Send to Telegram
        env:
          TEMPO_KEY: ${{ secrets.TEMPO_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PATH="$HOME/.tempo/bin:$PATH"

          NEWS=$(tempo request "https://cryptopanic.com/api/free/v1/posts/?auth_token=public&filter=hot&currencies=BTC,ETH&kind=news&limit=5" 2>/dev/null)

          MSG=$(echo "$NEWS" | python3 -c "
import sys, json
d = json.load(sys.stdin)
results = d.get('results', [])[:5]
lines = ['📰 5 Tin tức Crypto nóng nhất hôm nay\n']
for i, item in enumerate(results, 1):
    title = item.get('title', 'N/A')
    url = item.get('url', '')
    lines.append(f'{i}. {title}')
    lines.append(f'   🔗 {url}')
    lines.append('')
import datetime
lines.append('📅 ' + datetime.datetime.now().strftime('%d/%m/%Y %H:%M'))
print('\n'.join(lines))
" 2>/dev/null || echo "Không thể lấy tin tức lúc này")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" > /dev/null
          echo "News sent!"
