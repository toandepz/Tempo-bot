name: Daily Weather

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tempo CLI
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Setup Tempo Wallet
        env:
          TEMPO_KEYS_TOML: ${{ secrets.TEMPO_KEYS_TOML }}
          TEMPO_CONFIG_TOML: ${{ secrets.TEMPO_CONFIG_TOML }}
        run: |
          mkdir -p "$HOME/.tempo/wallet"
          echo "$TEMPO_KEYS_TOML" > "$HOME/.tempo/wallet/keys.toml"
          echo "$TEMPO_CONFIG_TOML" > "$HOME/.tempo/config.toml"
          export PATH="$HOME/.tempo/bin:$PATH"
          tempo wallet whoami

      - name: Send Weather to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PATH="$HOME/.tempo/bin:$PATH"
          WEATHER=$(tempo request 'https://wttr.in/Hanoi?format=j1' 2>/dev/null) || WEATHER=""
          TEMP=$(echo "$WEATHER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['current_condition'][0]['temp_C'])" 2>/dev/null || echo "N/A")
          FEELS=$(echo "$WEATHER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['current_condition'][0]['FeelsLikeC'])" 2>/dev/null || echo "N/A")
          HUMID=$(echo "$WEATHER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['current_condition'][0]['humidity'])" 2>/dev/null || echo "N/A")
          DESC=$(echo "$WEATHER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['current_condition'][0]['weatherDesc'][0]['value'])" 2>/dev/null || echo "N/A")
          DATE=$(date '+%d/%m/%Y %H:%M')
          TEXT="Du bao thoi tiet Ha Noi - $DATE%0ANhiet do: ${TEMP}C (cam giac ${FEELS}C)%0ADo am: ${HUMID}%%0ATrang thai: ${DESC}"
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}" > /dev/null
          echo "Done!"
