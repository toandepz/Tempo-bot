name: 🌤 Daily Weather

on:
  schedule:
    - cron: "0 23 * * *"  # 6:00 sáng Hà Nội (UTC+7)
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tempo CLI
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Get Weather & Send to Telegram
        env:
          TEMPO_KEY: ${{ secrets.TEMPO_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PATH="$HOME/.tempo/bin:$PATH"

          WEATHER=$(tempo request "https://wttr.in/Hanoi?format=j1" 2>/dev/null)

          TEMP_C=$(echo "$WEATHER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['current_condition'][0]['temp_C'])" 2>/dev/null || echo "N/A")
          FEELS=$(echo "$WEATHER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['current_condition'][0]['FeelsLikeC'])" 2>/dev/null || echo "N/A")
          DESC=$(echo "$WEATHER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['current_condition'][0]['weatherDesc'][0]['value'])" 2>/dev/null || echo "N/A")
          HUMID=$(echo "$WEATHER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['current_condition'][0]['humidity'])" 2>/dev/null || echo "N/A")

          MSG="🌤 Thời tiết Hà Nội hôm nay

🌡 Nhiệt độ: ${TEMP_C}°C (cảm giác ${FEELS}°C)
💧 Độ ẩm: ${HUMID}%
⛅ Trạng thái: ${DESC}

📅 $(date '+%d/%m/%Y %H:%M')"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
          echo "Weather sent!"
