name: Daily Fund Investments

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  send-investments:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tempo CLI
        run: |
          curl -fsSL https://tempo.xyz/install | bash
          echo "$HOME/.tempo/bin" >> $GITHUB_PATH

      - name: Setup Tempo Wallet
        env:
          TEMPO_KEYS_TOML: ${{ secrets.TEMPO_KEYS_TOML }}
          TEMPO_CONFIG_TOML: ${{ secrets.TEMPO_CONFIG_TOML }}
        run: |
          mkdir -p "$HOME/.tempo/wallet"
          printf '%s' "$TEMPO_KEYS_TOML" > "$HOME/.tempo/wallet/keys.toml"
          printf '%s' "$TEMPO_CONFIG_TOML" > "$HOME/.tempo/config.toml"
          tempo wallet whoami

      - name: Fetch Fund Investments via Tempo Perplexity
        run: |
          TODAY=$(date +"%B %d, %Y")
          python3 - "$TODAY" << 'BODYEOF'
          import json, sys
          today = sys.argv[1]
          body = {
              "model": "sonar-pro",
              "messages": [{"role": "user", "content": (
                  "As of " + today + ", list the 5 most notable venture capital or institutional "
                  "fund investment deals from THIS WEEK in AI, crypto, or tech. "
                  "For each deal: (1) Fund/Investor name, (2) Company invested in, "
                  "(3) Amount raised if available, (4) Sector. "
                  "Format as a numbered list. Be concise and factual."
              )}],
              "max_tokens": 600,
              "search_recency_filter": "week"
          }
          with open('/tmp/funds_body.json', 'w') as f:
              json.dump(body, f)
          print("Body written OK for:", today)
          BODYEOF

          tempo request -j -X POST \
            -d @/tmp/funds_body.json \
            -H 'Content-Type: application/json' \
            https://perplexity.mpp.paywithlocus.com/perplexity/chat \
            > /tmp/funds.json 2>/tmp/funds_err.txt
          EXIT=$?
          echo "Exit=$EXIT Size=$(wc -c < /tmp/funds.json)"
          if [ $EXIT -ne 0 ] || [ ! -s /tmp/funds.json ]; then
            echo "=== stderr ===" && cat /tmp/funds_err.txt || true
            printf '{"success":false,"data":{"choices":[{"message":{"content":"Khong the lay du lieu dau tu luc nay, vui long thu lai sau."}}],"citations":[],"search_results":[]}}' > /tmp/funds.json
          fi

      - name: Send Fund Investments to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, urllib.request, urllib.parse, datetime

          token = os.environ['TELEGRAM_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          now = datetime.datetime.now().strftime('%d/%m/%Y %H:%M')

          try:
              with open('/tmp/funds.json') as f:
                  raw = f.read().strip()
              if not raw:
                  raise ValueError("Empty response file")
              result = json.loads(raw)

              content = result['data']['choices'][0]['message']['content']
              content = re.sub(r'\[\d+\]', '', content)
              content = content.replace('**', '').replace('*', '').strip()

              search_results = result['data'].get('search_results', [])

              lines = [
                  '\U0001f4bc C\xe1c Quỹ Đang Đầu Tư - ' + now,
                  '━' * 22,
                  '',
                  content,
                  '',
                  '━' * 22,
              ]
              if search_results:
                  lines.append('\U0001f4f0 Nguồn:')
                  for sr in search_results[:3]:
                      t = sr.get('title', '')
                      u = sr.get('url', '')
                      if t and u:
                          lines.append('  \U0001f517 ' + t[:60] + ('...' if len(t) > 60 else ''))
              lines.append('━' * 22)
              lines.append('\U0001f916 Perplexity AI qua Tempo')
              text = '\n'.join(lines)

          except Exception as e:
              text = '❌ Lỗi lấy dữ liệu đầu tư - ' + now + '\n' + str(e)

          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'disable_web_page_preview': 'true'
          }).encode()
          req = urllib.request.Request(
              'https://api.telegram.org/bot' + token + '/sendMessage', data=data
          )
          resp = urllib.request.urlopen(req)
          print('Sent OK:', resp.status)
          PYEOF
