name: SurfAI Daily Post

on:
  workflow_dispatch:  # Chi chay thu cong, khong tu dong

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tempo CLI
        run: |
          curl -fsSL https://tempo.xyz/install | bash
          echo "$HOME/.tempo/bin" >> $GITHUB_PATH

      - name: Setup Tempo Wallet
        env:
          TEMPO_KEYS_TOML: ${{ secrets.TEMPO_KEYS_TOML }}
          TEMPO_CONFIG_TOML: ${{ secrets.TEMPO_CONFIG_TOML }}
          TEMPO_STORE_JSON: ${{ secrets.TEMPO_STORE_JSON }}
        run: |
          mkdir -p "$HOME/.tempo/wallet"
          printf '%s' "$TEMPO_KEYS_TOML"   > "$HOME/.tempo/wallet/keys.toml"
          printf '%s' "$TEMPO_CONFIG_TOML" > "$HOME/.tempo/config.toml"
          printf '%s' "$TEMPO_STORE_JSON"  > "$HOME/.tempo/wallet/store.json"
          tempo wallet whoami

      - name: Research SurfAI + Write Tweet
        run: |
          python3 << 'PYEOF'
          import json, datetime
          today = datetime.datetime.now().strftime("%B %d, %Y")
          prompt = (
              "Today is " + today + ". "
              "Research @SurfAI (website: asksurf.ai) for the LATEST updates this week. "
              "Then write ONE tweet in Vietnamese about it. "
              "Style rules: "
              "1) Use 'minh' (not 'tao/toi'), 'ban' (not 'may'). "
              "2) First line must be surprising/funny hook - not directly about the project. "
              "3) Use Vietnamese crypto slang: 'cu khoai lang nuong' (million $), 'bao' (grind), 'chien than', 'cooking', 'load'. "
              "4) Short bullet points with checkmarks and fire emoji. "
              "5) Tag @SurfAI. "
              "6) End with personal call-to-action, warm and intimate tone like talking to close friends. "
              "7) Max 280 characters. "
              "8) Output ONLY the tweet text, nothing else."
          )
          body = {
              "model": "sonar-pro",
              "messages": [{"role": "user", "content": prompt}],
              "max_tokens": 300,
              "search_recency_filter": "week"
          }
          with open('/tmp/tweet_body.json', 'w') as f:
              json.dump(body, f)
          print("Body OK for:", today)
          PYEOF

          tempo request -j -X POST \
            -d @/tmp/tweet_body.json \
            -H 'Content-Type: application/json' \
            https://perplexity.mpp.paywithlocus.com/perplexity/chat \
            -o /tmp/tweet_result.json > /dev/null 2>/dev/null
          EXIT=$?
          echo "TWEET_EXIT=$EXIT SIZE=$(wc -c < /tmp/tweet_result.json 2>/dev/null || echo 0)"
          if [ $EXIT -ne 0 ] || [ ! -s /tmp/tweet_result.json ]; then
            printf '{"success":false,"data":{"choices":[{"message":{"content":"SurfAI dang cooking update moi - minh se cap nhat som ban nhe! @SurfAI asksurf.ai"}}],"citations":[],"search_results":[]}}' > /tmp/tweet_result.json
          fi

      # Generate Image: DA XOA - khong dung trong GitHub Actions
      #  (X posting fail vi KEY_BYTE nen generate anh ton phi vo ich)

      - name: Post to X + Send Discord
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python3 -m pip install twikit bs4 -q
          python3 << 'PYEOF'
          import json, os, re, base64, urllib.request, urllib.parse

          auth_token = os.environ['X_AUTH_TOKEN']
          ct0 = os.environ['X_CT0']
          discord_token = os.environ.get('DISCORD_TOKEN', '')

          with open('/tmp/tweet_result.json') as f:
              data = json.load(f)
          tweet = data['data']['choices'][0]['message']['content']
          tweet = re.sub(r'\[\d+\]', '', tweet).strip()
          tweet = re.sub(r'\*\*(.+?)\*\*', r'\1', tweet)
          tweet = re.sub(r'\*(.+?)\*', r'\1', tweet)
          tweet = re.sub(r'__(.+?)__', r'\1', tweet)
          # X counts supplementary-plane chars (emoji > U+FFFF) as 2
          def x_len(s):
              return sum(2 if ord(c) > 0xFFFF else 1 for c in s)
          while x_len(tweet) > 270:
              tweet = tweet[:-1]
          print("TWEET:", tweet[:120])
          print(f"Length: {x_len(tweet)}")

          BEARER = "AAAAAAAAAAAAAAAAAAAAANRILgAAAAAAnNwIzUejRCOuH5E6I8xnZz4puTs%3D1Zv7ttfk8LF81IUq16cHjhLTvJu4FA33AGWWjCpTnA"
          headers = {
              'Authorization': f'Bearer {BEARER}',
              'Cookie': f'auth_token={auth_token}; ct0={ct0}',
              'x-csrf-token': ct0,
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
              'x-twitter-active-user': 'yes',
              'x-twitter-auth-type': 'OAuth2Session',
              'x-twitter-client-language': 'en',
          }

          # Upload anh qua v1.1 media upload
          media_id = None
          try:
              with open('/tmp/post_img.jpeg', 'rb') as f:
                  img_b64 = base64.b64encode(f.read()).decode()
              udata = urllib.parse.urlencode({'media_data': img_b64, 'media_type': 'image/jpeg'}).encode()
              req = urllib.request.Request(
                  'https://upload.twitter.com/1.1/media/upload.json',
                  data=udata,
                  headers={**headers, 'Content-Type': 'application/x-www-form-urlencoded'},
                  method='POST'
              )
              with urllib.request.urlopen(req) as r:
                  media_id = json.loads(r.read())['media_id_string']
              print(f"Media: {media_id}")
          except Exception as e:
              print(f"No image: {e}")

          # Dung twikit voi KEY_BYTE patch de co x-client-transaction-id
          import asyncio

          tweet_url = ""
          async def post_tweet_twikit():
              from twikit import Client
              from twikit.x_client_transaction.transaction import ClientTransaction
              import re as re2

              # Patch KEY_BYTE: tu fetch homepage de lay indices
              browser_ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
              fetch_headers = {
                  'User-Agent': browser_ua,
                  'Accept': 'text/html,application/xhtml+xml,*/*;q=0.9',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Cookie': f'auth_token={auth_token}; ct0={ct0}',
                  'sec-fetch-dest': 'document', 'sec-fetch-mode': 'navigate',
              }
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://x.com/home', headers=fetch_headers), timeout=15) as rh:
                      html = rh.read().decode('utf-8', errors='ignore')
                  # Tim tat ca JS URLs trong HTML va scan tim KEY_BYTE pattern
                  js_urls_found = re2.findall(
                      r'https://abs\.twimg\.com/responsive-web/client-web/[^\s"\'<>]+\.js',
                      html
                  )
                  # Uu tien file nho (ondemand) truoc
                  js_urls_found = sorted(set(js_urls_found), key=lambda u: (0 if 'ondemand' in u else 1, len(u)))
                  print(f"JS files found: {len(js_urls_found)}, first: {js_urls_found[0][-50:] if js_urls_found else 'none'}")
                  KEY_BYTE_PATTERN = re2.compile(r'\(\w\[(\d{1,2})\],\s*16\)')
                  found_indices = False
                  for js_url in js_urls_found[:30]:
                      try:
                          with urllib.request.urlopen(urllib.request.Request(js_url, headers=fetch_headers), timeout=10) as rj:
                              js = rj.read().decode('utf-8', errors='ignore')
                          # File dung phai chua "obfiowerehiring" (twikit keyword)
                          if 'obfiowerehiring' not in js:
                              continue
                          indices = [int(x) for x in KEY_BYTE_PATTERN.findall(js)]
                          if len(indices) >= 5:  # Can nhieu indices
                              ClientTransaction.DEFAULT_ROW_INDEX = indices[0]
                              ClientTransaction.DEFAULT_KEY_BYTES_INDICES = indices[1:]
                              print(f"KEY_BYTE found in {js_url[-35:]}: row={indices[0]} n={len(indices)}")
                              found_indices = True
                              break
                      except Exception:
                          continue
                  if not found_indices:
                      print("KEY_BYTE: not found in any JS file")
                  else:
                      # Patch get_indices de twikit.init() dung gia tri da fetch
                      cached_row = ClientTransaction.DEFAULT_ROW_INDEX
                      cached_kbytes = ClientTransaction.DEFAULT_KEY_BYTES_INDICES
                      async def patched_get_indices(self, *args, **kwargs):
                          return (cached_row, cached_kbytes)
                      ClientTransaction.get_indices = patched_get_indices
                      print(f"Patched get_indices: row={cached_row} kbytes={cached_kbytes[:4]}")
              except Exception as e:
                  print(f"KEY_BYTE fetch failed: {e}")

              client = Client('en-US')
              client.set_cookies({'auth_token': auth_token, 'ct0': ct0})
              try:
                  media_ids_arg = [media_id] if media_id else None
                  tw = await client.create_tweet(text=tweet, media_ids=media_ids_arg)
                  url = f"https://x.com/Hanzentrade/status/{tw.id}"
                  print(f"POSTED: {url}")
                  return url
              except Exception as e:
                  print(f"Post X failed: {e}")
                  return ""

          tweet_url = asyncio.run(post_tweet_twikit())

          # Gui Discord
          if tweet_url and discord_token:
              try:
                  msg_body = json.dumps({"content": tweet_url}).encode()
                  req4 = urllib.request.Request(
                      'https://discord.com/api/v9/channels/1512125117302575154/messages',
                      data=msg_body,
                      headers={'Authorization': discord_token, 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'},
                      method='POST'
                  )
                  with urllib.request.urlopen(req4) as r4:
                      print(f"Discord sent: {r4.status}")
              except Exception as e:
                  print(f"Discord error: {e}")
          elif not discord_token:
              print("DISCORD_TOKEN not set - skipping Discord")
          PYEOF

